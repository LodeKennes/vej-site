<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Pea extraction points each field at an exact span of the invoice text">
  <style>
    .bg { fill: #F5F2EB; } .card { fill: #FCFAF5; stroke: #DCD7CB; } .mark { fill: #EAECE2; stroke: #245C3A; stroke-opacity: .35; }
