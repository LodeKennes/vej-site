    .value, .null { font-family: Georgia, "Times New Roman", serif; font-size: 24px; fill: #245C3A; } .null { fill: #8A5E0F; font-style: italic; }
    .link { fill: none; stroke: #245C3A; stroke-width: 1.5; stroke-opacity: .55; } .dot { fill: #245C3A; }
    @media (prefers-color-scheme: dark) {
