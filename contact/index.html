<section class="page-hero"><h1>Contact</h1><p class="lead">Send a message about Vej, the models or the hosted API. Vej stores it to reply.</p></section><section class="section contact-form"><noscript><p>Enable JavaScript to send this form, or email <a href="mailto:hello@itsvej.com">hello@itsvej.com</a>.</p></noscript><form data-signup-form data-kind="contact"><label for="contact-name">Name <span>(optional)</span></label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" /><label for="contact-email">Email address <span>(required)</span></label><input id="contact-email" name="email" type="email" autocomplete="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" title="Use an email address such as name@example.com." required maxlength="254" /><label for="contact-message">Message <span>(required)</span></label><textarea id="contact-message" name="message" required maxlength="2000" rows="6"></textarea><label class="consent" for="contact-consent"><input id="contact-consent" name="consent" type="checkbox" required />Vej may store this message to reply.</label><div class="form-trap" aria-hidden="true"><label for="contact-website">Leave this field empty</label><input id="contact-website" name="website" autocomplete="off" tabindex="-1" /></div><div data-turnstile></div><button class="button" type="submit" disabled>Send message</button><button class="button secondary" type="button" data-retry hidden>Retry browser check</button><p class="form-feedback" role="status" aria-live="polite"></p><p class="small">We store this message to reply. <a href="/privacy/">Privacy</a>.</p></form></section>
